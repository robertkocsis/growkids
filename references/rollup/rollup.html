<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowKids Future — Roll-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Brand fonts: Newsreader (headings) + Manrope (body/UI) -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =================================================================
   GrowKids Future — Roll-up banner
   Source of truth: the GrowKids design system ("Nurturing Growth").
   Tokens below mirror src/styles/global.css. Edit text inline,
   colors via the variables, images in /assets.
   ================================================================= */
:root{
  /* ---- Surface family ---- */
  --surface:        #f4fafd;
  --surface-low:    #eef5f7;
  --white:          #ffffff;   /* surface-container-lowest */
  --on-surface:     #161d1f;
  --on-surface-var: #44483f;
  --outline-var:    #c4c8bc;

  /* ---- Primary (Sage Green) ---- */
  --primary:        #4a633a;
  --primary-cont:   #627c51;
  --on-primary:     #ffffff;
  --on-primary-cont:#f8ffed;
  --primary-fixed:  #ceecb8;

  /* ---- Tertiary (Muted Olive) ---- */
  --tertiary:       #53604c;
  --tertiary-fixed: #d9e7ce;
  --tertiary-dim:   #bdcbb3;

  /* ---- Shape & elevation ---- */
  --radius:    .5rem;
  --radius-lg: 1rem;
  --radius-xl: 1.5rem;
  --shadow-ambient:    0 8px 32px 0 rgba(74,99,58,.06);
  --shadow-ambient-md: 0 12px 40px 0 rgba(74,99,58,.10);

  --banner-w: 460px;            /* on-screen width */
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:#dde4e6;
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--on-surface);
  display:flex; justify-content:center; padding:40px 16px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}

/* ---------- typography utilities (from the design system) ---------- */
.headline-xl{ font-family:'Newsreader',serif; font-weight:600; line-height:1.1; letter-spacing:-.02em; }
.title-sm{ font-family:'Newsreader',serif; font-weight:600; line-height:1.25; }
.quote{ font-family:'Newsreader',serif; font-style:italic; font-weight:500; line-height:1.4; }
.label-sm{ font-family:'Manrope',sans-serif; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
.body-md{ font-family:'Manrope',sans-serif; font-weight:400; line-height:1.6; }

/* ---------- stand ---------- */
.stand{ width:var(--banner-w); }
.rail{ height:10px; border-radius:5px; width:calc(100% + 24px); margin-left:-12px;
  background:linear-gradient(#eef2f4,#c4ccd1 60%,#a7b0b6); box-shadow:0 1px 2px rgba(0,0,0,.2); }

/* ---------- banner ---------- */
.banner{
  width:100%; background:var(--surface); position:relative; overflow:hidden;
  box-shadow:0 14px 44px rgba(22,29,31,.16); display:flex; flex-direction:column;
}

/* ---------- header / logo ---------- */
.header{ text-align:center; padding:30px 24px 10px; }
.emblem{ width:30%; max-width:148px; display:block; margin:0 auto 10px; }
.wordmark{ font-family:'Newsreader',serif; font-size:clamp(30px,8vw,42px); font-weight:600; line-height:1; letter-spacing:.3px; }
.wordmark .grow{ color:var(--on-surface); }
.wordmark .kids{ color:var(--primary); }
.wordmark .future{ color:var(--primary-cont); font-weight:500; }
.tagline{ font-family:'Newsreader',serif; font-style:italic; font-weight:500;
  color:var(--primary); font-size:clamp(14px,3.6vw,18px); margin-top:8px; }

/* ---------- photo (brand card: rounded-xl + ambient shadow) ---------- */
.photo{
  margin:18px 22px 6px; height:300px; border-radius:var(--radius-xl);
  background:url('assets/photo.jpg') center 42%/cover no-repeat;
  box-shadow:var(--shadow-ambient-md);
}

/* ---------- headline (mirrors the site hero) ---------- */
.headline{ text-align:center; padding:26px 26px 6px; }
.headline h1{ font-size:clamp(30px,8.4vw,46px); }
.headline .accent{ color:var(--primary); }
.headline .rest{ color:var(--on-surface); }
/* leaf divider: line — leaf — line */
.divider{ display:flex; align-items:center; justify-content:center; gap:12px; margin:18px auto 0; }
.divider .ln{ height:1px; width:46px; background:var(--outline-var); }
.divider svg{ width:18px; height:18px; color:var(--primary); }

/* ---------- services ---------- */
.services{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:26px 16px 30px; }
.service{ text-align:center; }
.service .disc{
  width:62px; height:62px; margin:0 auto; border-radius:var(--radius-full,9999px);
  background:var(--tertiary-fixed); color:var(--primary);
  display:grid; place-items:center;
}
.service .disc svg{ width:34px; height:34px; }
.service p{ margin-top:12px; color:var(--on-surface-var); font-family:'Manrope',sans-serif;
  font-weight:600; font-size:clamp(8px,2.1vw,10px); letter-spacing:.04em; line-height:1.3; text-transform:uppercase; }

/* ---------- footer (primary band) ---------- */
.footer{ margin-top:auto; position:relative; }
.footer-wave{ display:block; width:100%; margin-bottom:-1px; color:var(--primary); }
.footer-band{ background:var(--primary); color:var(--on-primary); padding:22px 22px 26px;
  display:flex; align-items:center; gap:16px; }
.contact{ display:flex; flex-direction:column; gap:16px; flex:1; }
.contact .row{ display:flex; align-items:center; gap:13px; }
.contact .ic{ width:36px; height:36px; border-radius:9999px; border:1.5px solid rgba(255,255,255,.85);
  display:grid; place-items:center; flex:none; }
.contact .ic svg{ width:20px; height:20px; color:#fff; }
.contact .txt{ font-family:'Manrope',sans-serif; font-weight:600; font-size:clamp(13px,3.4vw,17px); }
.qr{ width:78px; height:78px; border-radius:var(--radius); background:#fff; padding:6px; flex:none; box-shadow:var(--shadow-ambient); }
.qr img, .qr svg{ width:100%; height:100%; display:block; }
.note{ width:78px; flex:none; text-align:center; color:var(--on-primary-cont); }
.note span{ font-family:'Newsreader',serif; font-style:italic; font-size:clamp(13px,3.4vw,16px); line-height:1.15; }
.note svg{ width:52px; display:block; margin:6px auto 0 -2px; color:var(--on-primary-cont); }

/* ---------- base ---------- */
.base{ width:calc(100% + 40px); margin-left:-20px; height:26px; border-radius:0 0 6px 6px;
  background:linear-gradient(#eef2f4,#b9c1c6 55%,#97a0a6); box-shadow:0 6px 10px rgba(0,0,0,.18); }
.feet{ display:flex; justify-content:space-between; width:60%; margin:0 auto; }
.feet span{ width:8px; height:30px; border-radius:0 0 4px 4px; background:linear-gradient(#c4ccd1,#97a0a6); }

/* ---------- print / PDF export ----------
   Hides the on-screen stand mockup and prints just the banner artwork.
   Width stays at --banner-w so the viewport-relative type keeps its
   exact on-screen layout; the exporter sizes the page to the banner. */
@page{ size:460px 1180px; margin:0; }   /* one page sized to the banner (≈1 : 2.55) */
@media print{
  body{ margin:0; padding:0; background:#fff; display:block; }
  .rail,.base,.feet{ display:none !important; }
  .stand{ width:var(--banner-w); }
  .banner{ box-shadow:none; }
}
</style>
</head>
